<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body {
        margin: 0;
        display: grid;
        grid-template-rows: 1fr 9fr;
      }

      #theCanvas {
        display: block;
      }

      #inputs {
        outline: 2px solid black;
        /*display: flex;
        flex-direction: row;*/
      }
    </style>
  </head>
  <body>
    <div id="inputs">
      Enter a size:
      <input type="number" id="sizeInput" min="5" max="500">
      Enter a color:
      <input type="color" id="colorInput">
      <button id="addBall">Add Ball</button>
    </div>
    <Canvas id="theCanvas">
    </Canvas>

    <script src="ball.js" type="module"></script>
  </body>
</html>
